# Supabase's free plan pauses a project after about a week without activity,
# which stops the waitlist form from saving signups. This pings the database
# every three days so that never happens. It only reads (and the public key
# can't read the list), so it changes nothing.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://chhkoajmaxjweugakhzm.supabase.co/rest/v1/waitlist?select=id&limit=1" \
            -H "apikey: sb_publishable_Oj-bEfguqOrt-5N-9pILLw_jhTFdI2r")
          echo "Supabase responded with HTTP $status"
          test "$status" -lt 500
