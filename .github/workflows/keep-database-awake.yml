# Supabase's free plan pauses a project after about a week without activity,
# which stops the waitlist form and the Study Hall sign-in from working.
# This runs a tiny real query (select 1) every two days so the project stays
# active. It reads nothing and changes nothing. If the database ever stops
# answering, this job fails, so GitHub emails a warning.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://chhkoajmaxjweugakhzm.supabase.co/rest/v1/rpc/keep_alive" \
            -H "apikey: sb_publishable_Oj-bEfguqOrt-5N-9pILLw_jhTFdI2r" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase responded with HTTP $status"
          test "$status" -eq 200
